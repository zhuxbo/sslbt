<div class="ssl-plugin" id="ssl-app">
  <div class="ssl-tabs">
    <span class="active" data-tab="certs">证书管理</span>
    <span data-tab="settings">设置</span>
    <span data-tab="logs">日志</span>
  </div>
  <div class="ssl-body">
    <div class="ssl-pane active" id="tab-certs"><div class="ssl-loading" id="cert-list">加载中...</div></div>
    <div class="ssl-pane" id="tab-settings"><div class="ssl-loading" id="settings-form">加载中...</div></div>
    <div class="ssl-pane" id="tab-logs">
      <div class="ssl-bar">
        <select id="log-date" onchange="sslbt.loadLogs()" class="ssl-select"></select>
        <button class="ssl-btn" onclick="sslbt.loadLogs()">刷新</button>
        <button class="ssl-btn" onclick="sslbt.clearLogs()">清除日志</button>
      </div>
      <pre class="ssl-log" id="log-content"></pre>
    </div>
  </div>
</div>

<style>
  /* 容器 */
  .ssl-plugin {
    margin: 0;
    padding: 0 5px;
    font-size: 13px;
    color: #303133;
    line-height: 1.5;
    box-sizing: border-box;
    overflow: hidden;
  }
  .ssl-plugin *,
  .ssl-plugin *::before,
  .ssl-plugin *::after {
    box-sizing: border-box;
  }

  /* Tab 导航 */
  .ssl-tabs {
    display: flex;
    border-bottom: 1px solid #e4e7ed;
    margin-bottom: 0;
    padding: 0;
  }
  .ssl-tabs span {
    padding: 10px 20px;
    cursor: pointer;
    color: #909399;
    font-size: 13px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .ssl-tabs span:hover { color: #409eff; }
  .ssl-tabs span.active {
    color: #409eff;
    border-bottom-color: #409eff;
    font-weight: 600;
  }

  /* 内容区 */
  .ssl-body {
    height: 460px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0;
  }
  .ssl-pane { display: none; }
  .ssl-pane.active { display: block; }
  .ssl-loading {
    text-align: center;
    padding: 0;
    color: #c0c4cc;
    font-size: 13px;
  }

  /* 统计栏 */
  .ssl-stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f5f7fa;
    border-bottom: 1px solid #ebeef5;
    padding: 10px 15px;
    margin-top: 16px;
  }
  .ssl-stats-left {
    font-size: 13px;
    color: #606266;
  }
  .ssl-stats-left .ssl-stat-num {
    font-weight: 600;
    color: #303133;
  }
  .ssl-stats-left .ssl-stat-sep {
    margin: 0 8px;
    color: #dcdfe6;
  }
  .ssl-stats-right {
    display: flex;
    gap: 6px;
  }

  /* 工具栏 */
  .ssl-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 15px;
    padding: 15px 5px 0;
  }

  /* 统一表单组件（覆盖宝塔面板全局样式） */
  .ssl-plugin input,
  .ssl-plugin select,
  .ssl-plugin button {
    height: 28px !important;
    line-height: 28px !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    box-sizing: border-box !important;
    vertical-align: middle !important;
    margin: 0 !important;
  }

  /* 按钮 */
  .ssl-btn {
    display: inline-block;
    padding: 0 14px;
    font-size: 12px;
    border: 1px solid #dcdfe6;
    border-radius: 3px;
    background: #fff;
    color: #606266;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .ssl-btn:hover {
    color: #409eff;
    border-color: #c6e2ff;
    background: #ecf5ff;
  }
  .ssl-btn-primary { color: #fff; background: #409eff; border-color: #409eff; }
  .ssl-btn-primary:hover { background: #66b1ff; border-color: #66b1ff; }
  .ssl-btn-success { color: #fff; background: #67c23a; border-color: #67c23a; }
  .ssl-btn-success:hover { background: #85ce61; border-color: #85ce61; }
  .ssl-btn-danger { color: #fff; background: #f56c6c; border-color: #f56c6c; }
  .ssl-btn-danger:hover { background: #f78989; border-color: #f78989; }
  .ssl-btn-warning { color: #fff; background: #e6a23c; border-color: #e6a23c; }
  .ssl-btn-warning:hover { background: #ebb563; border-color: #ebb563; }
  .ssl-btn-sm { padding: 0 10px; font-size: 12px; height: 28px; line-height: 28px; }

  /* 下拉框 */
  .ssl-select {
    padding: 0 10px;
    border: 1px solid #dcdfe6;
    border-radius: 3px;
    font-size: 12px;
    color: #606266;
    background: #fff;
    outline: none;
  }
  .ssl-select:focus { border-color: #409eff; }

  /* 状态标签 */
  .ssl-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 12px;
    line-height: 1.6;
  }
  .ssl-tag-success { background: #f0f9eb; color: #67c23a; }
  .ssl-tag-info { background: #f4f4f5; color: #909399; }
  .ssl-tag-primary { background: #ecf5ff; color: #409eff; }
  .ssl-tag-warning { background: #fdf6ec; color: #e6a23c; }
  .ssl-tag-danger { background: #fef0f0; color: #f56c6c; }

  /* 证书列表 — 可折叠行 */
  .ssl-cert-list {
    padding: 0 5px;
    margin: 16px 0;
  }
  .ssl-cert-list .ssl-cert-row:first-child {
    border-top: 1px solid #ebeef5;
  }
  .ssl-cert-row {
    border-bottom: 1px solid #ebeef5;
    cursor: pointer;
    transition: background 0.15s;
  }
  .ssl-cert-row:hover {
    background: #f5f7fa;
  }
  .ssl-cert-summary {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    font-size: 13px;
    color: #606266;
    gap: 12px;
  }
  .ssl-cert-oid {
    color: #909399;
    font-size: 12px;
    flex-shrink: 0;
  }
  .ssl-cert-domain {
    color: #303133;
    font-weight: 500;
    flex: 1;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ssl-cert-sites {
    color: #909399;
    font-size: 12px;
    flex-shrink: 0;
  }
  .ssl-cert-expire {
    font-size: 12px;
    color: #909399;
    flex-shrink: 0;
  }

  /* 展开详情 */
  .ssl-cert-detail {
    display: none;
    background: #fafafa;
    padding: 15px 20px;
    border-top: 1px solid #ebeef5;
  }
  .ssl-cert-row.expanded .ssl-cert-detail {
    display: block;
  }

  /* 详情信息网格 */
  .ssl-detail-grid {
    display: table;
    margin-bottom: 15px;
    width: 100%;
  }
  .ssl-detail-item {
    display: table-row;
    font-size: 12px;
  }
  .ssl-detail-item .ssl-detail-label {
    display: table-cell;
    color: #909399;
    text-align: right;
    padding: 3px 10px 3px 0;
    white-space: nowrap;
    width: 70px;
  }
  .ssl-detail-item .ssl-detail-val {
    display: table-cell;
    color: #303133;
    text-align: left;
    padding: 3px 0;
  }

  /* 绑定站点（与证书信息同布局，带分隔线） */
  .ssl-detail-grid-sites {
    border-top: 1px solid #ebeef5;
    padding-top: 8px;
    padding-bottom: 8px;
    margin-bottom: 0;
  }
  .ssl-detail-grid-sites .ssl-site-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ssl-detail-grid-sites .ssl-site-tags {
    margin-left: auto;
    display: flex;
    gap: 8px;
    white-space: nowrap;
  }
  .ssl-detail-grid-sites .ssl-unmatched {
    font-size: 11px;
    color: #e6a23c;
  }

  /* 详情操作按钮 */
  .ssl-detail-actions {
    display: flex;
    gap: 6px;
    padding-top: 10px;
    border-top: 1px solid #ebeef5;
  }

  /* 空状态 */
  .ssl-empty {
    text-align: center;
    padding: 60px 0;
    color: #c0c4cc;
  }

  /* 设置表单 */
  .ssl-settings-section {
    padding: 20px 0;
  }
  .ssl-settings-section + .ssl-settings-section {
    border-top: 1px solid #ebeef5;
  }
  .ssl-settings-section table {
    border: none;
    table-layout: fixed;
    width: 100%;
  }
  .ssl-settings-section table td {
    padding: 6px 8px;
    border: none;
    vertical-align: middle;
    font-size: 13px;
    text-align: left;
  }
  .ssl-settings-section table td:first-child {
    text-align: right;
    color: #606266;
    white-space: nowrap;
    width: 100px;
  }
  .ssl-settings-section table input,
  .ssl-settings-section table select {
    padding: 7px 10px;
    border: 1px solid #dcdfe6;
    border-radius: 3px;
    font-size: 13px;
    color: #606266;
    outline: none;
  }
  .ssl-settings-section table input:focus,
  .ssl-settings-section table select:focus {
    border-color: #409eff;
  }

  /* 表格（弹窗内使用） */
  .ssl-table { width: 100%; border-collapse: collapse; }
  .ssl-table th {
    background: #fafafa;
    font-weight: 600;
    font-size: 12px;
    color: #909399;
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid #ebeef5;
  }
  .ssl-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #ebeef5;
    font-size: 13px;
    color: #606266;
  }

  /* 更新区块 */
  .ssl-update-msg {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
  }
  .ssl-update-msg.success { background: #f0f9eb; border: 1px solid #c2e7b0; color: #67c23a; }
  .ssl-update-msg.info { background: #f4f4f5; color: #909399; }
  .ssl-update-msg.error { background: #fef0f0; color: #f56c6c; }
  .ssl-update-msg.loading { background: #fdf6ec; color: #e6a23c; }

  /* 日志 */
  .ssl-log {
    background: #1d1f21;
    color: #c5c8c6;
    padding: 14px;
    border-radius: 4px;
    font-size: 12px;
    font-family: Menlo, Monaco, Consolas, monospace;
    line-height: 1.7;
    height: 350px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
  }
</style>

<script>
(function () {
  var P = {
    _certCache: {},   // order_id → detail data
    _certList: null,  // cached cert list for stats
    _settingsRendered: false,
    _settingsLoading: false,
    _settingsLoaded: false,
    _postUpdateKey: 'sslbt-post-update-version',

    _call: function (method, data, cb, errCb) {
      var d = {};
      if (data) {
        for (var k in data) d[k] = data[k];
      }
      var req = $.post(
        '/plugin?action=a&s=' + method + '&name=sslbt',
        d,
        function (r) {
          if (typeof r === 'string') {
            try { r = JSON.parse(r); } catch (e) { r = { status: false, msg: r }; }
          }
          cb && cb(r);
        },
        'json'
      );
      if (errCb) req.fail(function (xhr) { errCb(xhr); });
      return req;
    },

    _e: function (s) {
      return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
    },
    _fmtTime: function (s) {
      if (!s || s === '-') return '-';
      try {
        var d = new Date(s.replace(' ', 'T').replace(/Z$/, '+00:00'));
        if (isNaN(d.getTime())) return s;
        var pad = function (n) { return n < 10 ? '0' + n : n; };
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      } catch (e) { return s; }
    },

    // loading 提示（返回关闭函数）
    _loading: function (text) {
      var idx = layer.msg(text || '处理中...', { icon: 16, time: 0, shade: 0.3 });
      return function () { layer.close(idx); };
    },

    init: function () {
      var self = this;
      $('.ssl-tabs span').on('click', function () {
        var t = $(this).data('tab');
        $(this).addClass('active').siblings().removeClass('active');
        $('#tab-' + t).addClass('active').siblings('.ssl-pane').removeClass('active');
        var m = { certs: 'loadCerts', settings: 'loadSettings', logs: 'loadLogs' };
        if (m[t]) self[m[t]]();
      });
      this.loadCerts();
      this._checkPostUpdate();
    },

    _rememberPostUpdate: function (version) {
      try { window.sessionStorage.setItem(P._postUpdateKey, version || ''); } catch (e) {}
    },

    _checkPostUpdate: function () {
      var expected = '';
      try { expected = window.sessionStorage.getItem(P._postUpdateKey) || ''; } catch (e) {}
      if (!expected) return;
      var clearMarker = function () {
        try { window.sessionStorage.removeItem(P._postUpdateKey); } catch (e) {}
      };
      var promptRestart = function () {
        clearMarker();
        layer.alert('刷新后未能正常加载目标版本，请重启宝塔面板后重新打开插件。', {
          closeBtn: 2,
          title: '需要重启面板',
          icon: 2,
          offset: 'auto',
          btn: ['我知道了']
        });
      };
      P._call('get_config', null, function (r) {
        var actual = r && r.status && r.data ? String(r.data.plugin_version || '') : '';
        var normalize = function (v) { return String(v || '').replace(/^v/, ''); };
        if (!actual || normalize(actual) !== normalize(expected)) {
          promptRestart();
          return;
        }
        clearMarker();
      }, promptRestart);
    },

    // ===== 续签终态识别 =====
    // CAPPED / EXPIRED / policy 阻断下续签引擎不再启动新动作且不发回调（deploy-spec §3.2），
    // 面板是用户侧唯一提示入口，不能让这些证书继续显示为「正常」。
    _CAP_STAGE_LABEL: {
      issue: '签发重试超限',
      deploy: '部署重试超限',
      legacy: '升级前已超限'
    },

    _haltInfo: function (cert) {
      var m = cert.metadata || {};
      var s = m.last_issue_state || '';
      if (!s || s === 'processing') return null;
      if (s === 'CAPPED') {
        var stage = P._CAP_STAGE_LABEL[m.cap_stage || ''] || '重试超限';
        return { label: '已停更（' + stage + '）', level: 'danger', halted: true };
      }
      if (s === 'EXPIRED') {
        return { label: '已过期停更', level: 'danger', halted: true };
      }
      if (s === 'policy_blocked_needs_setup') {
        return { label: '需重设续签策略', level: 'warning', halted: true };
      }
      // 订单终态（cancelled / revoked 等）：续签引擎已停止等待人工处理
      return { label: '订单异常: ' + s, level: 'warning', halted: true };
    },

    // 详情页「续签状态」行：终态标签 + 计数 + 环境阻断原因
    _renewStateHtml: function (cert) {
      var m = cert.metadata || {};
      var halt = P._haltInfo(cert);
      var parts = [];
      if (halt) {
        parts.push('<span class="ssl-tag ssl-tag-' + halt.level + '">' + P._e(halt.label) + '</span>');
        parts.push('<span style="color:#909399">已停止自动续签，需人工处理</span>');
      } else if ((m.last_issue_state || '') === 'processing') {
        parts.push('<span class="ssl-tag ssl-tag-primary">等待签发</span>');
      } else {
        parts.push('<span class="ssl-tag ssl-tag-success">自动续签中</span>');
      }
      var issued = m.issue_retry_count || 0;
      var deployed = m.deploy_attempt_count || 0;
      if (issued || deployed) {
        parts.push('<span style="color:#909399">签发尝试 ' + issued + ' / 部署尝试 ' + deployed + '</span>');
      }
      if (m.last_deploy_block_reason) {
        parts.push('<span style="color:#e6a23c">环境阻断（' + P._fmtTime(m.last_deploy_block_at || '') + '）: '
          + P._e(m.last_deploy_block_reason) + '</span>');
      }
      return parts.join('<span class="ssl-stat-sep">|</span>');
    },

    // ===== 统计计算 =====
    _calcStats: function (certs) {
      var total = certs.length, enabled = 0, expiring = 0, expired = 0, halted = 0;
      var now = new Date();
      var threshold = 14 * 24 * 60 * 60 * 1000;
      for (var i = 0; i < certs.length; i++) {
        var c = certs[i];
        if (c.enabled !== false) enabled++;
        var halt = P._haltInfo(c);
        if (halt && halt.halted) halted++;
        var exp = (c.metadata || {}).cert_expires_at || '';
        if (!exp) continue;
        try {
          var d = new Date(exp.replace(' ', 'T').replace(/Z$/, '+00:00'));
          var diff = d.getTime() - now.getTime();
          if (diff < 0) expired++;
          else if (diff <= threshold) expiring++;
        } catch (e) {}
      }
      return { total: total, enabled: enabled, expiring: expiring, expired: expired, halted: halted };
    },

    _renderStatsBar: function (stats) {
      var h = '<div class="ssl-stats-bar">';
      h += '<div class="ssl-stats-left">';
      h += '证书 <span class="ssl-stat-num">' + stats.total + '</span>';
      h += '<span class="ssl-stat-sep">|</span>';
      h += '已启用 <span class="ssl-stat-num">' + stats.enabled + '</span>';
      h += '<span class="ssl-stat-sep">|</span>';
      h += '即将过期 <span class="ssl-stat-num" style="color:' + (stats.expiring > 0 ? '#e6a23c' : '') + '">' + stats.expiring + '</span>';
      h += '<span class="ssl-stat-sep">|</span>';
      h += '已过期 <span class="ssl-stat-num" style="color:' + (stats.expired > 0 ? '#f56c6c' : '') + '">' + stats.expired + '</span>';
      h += '<span class="ssl-stat-sep">|</span>';
      h += '已停更 <span class="ssl-stat-num" style="color:' + (stats.halted > 0 ? '#f56c6c' : '') + '">' + stats.halted + '</span>';
      h += '</div>';
      h += '<div class="ssl-stats-right">';
      h += '<button class="ssl-btn ssl-btn-success ssl-btn-sm" onclick="sslbt.addCert()">一键部署</button>';
      h += '<button class="ssl-btn ssl-btn-sm" onclick="sslbt.runRenew()">续签</button>';
      h += '<button class="ssl-btn ssl-btn-danger ssl-btn-sm" onclick="sslbt.batchRemove()">删除</button>';
      h += '</div>';
      h += '</div>';
      return h;
    },

    // ===== 状态标签 =====
    _statusTag: function (cert) {
      var m = cert.metadata || {};
      var exp = m.cert_expires_at || '';
      var deployed = m.last_deploy_at || '';
      var sites = cert.site_name || [];
      if (typeof sites === 'string') sites = sites ? [sites] : [];
      // 终态优先于到期判断：这些证书已停止自动续签，不能显示为「正常」
      var halt = P._haltInfo(cert);
      if (halt) return '<span class="ssl-tag ssl-tag-' + halt.level + '">' + P._e(halt.label) + '</span>';
      if (!exp) {
        if (!sites.length) return '<span class="ssl-tag ssl-tag-info">未绑定</span>';
        if (!deployed) return '<span class="ssl-tag ssl-tag-primary">待部署</span>';
        return '<span class="ssl-tag ssl-tag-success">已部署</span>';
      }
      try {
        var d = new Date(exp.replace(' ', 'T').replace(/Z$/, '+00:00'));
        var diff = d.getTime() - new Date().getTime();
        if (diff < 0) return '<span class="ssl-tag ssl-tag-danger">已过期</span>';
        if (diff <= 14 * 24 * 60 * 60 * 1000) return '<span class="ssl-tag ssl-tag-warning">即将过期</span>';
      } catch (e) {}
      if (cert.enabled !== false) return '<span class="ssl-tag ssl-tag-success">正常</span>';
      return '<span class="ssl-tag ssl-tag-info">已禁用</span>';
    },

    // ===== 证书管理 =====
    loadCerts: function () {
      P._call('get_cert_list', null, function (r) {
        if (!r.status) {
          $('#cert-list').html('<div class="ssl-loading">' + P._e(r.msg) + '</div>');
          return;
        }
        var certs = r.data || [];
        P._certList = certs;

        var stats = P._calcStats(certs);
        var h = P._renderStatsBar(stats);

        if (!certs.length) {
          h += '<div class="ssl-empty">暂无证书，请点击"添加证书"</div>';
          $('#cert-list').html(h);
          return;
        }

        h += '<div class="ssl-cert-list">';
        for (var i = 0; i < certs.length; i++) {
          var c = certs[i];
          var m = c.metadata || {};
          var mainDomain = (c.domains && c.domains.length) ? c.domains[0] : '-';
          var exp = m.cert_expires_at ? m.cert_expires_at.substr(0, 10) : '';
          var siteNames = c.site_name || [];
          if (typeof siteNames === 'string') siteNames = siteNames ? [siteNames] : [];
          var siteText = siteNames.length > 0 ? '&rarr; ' + siteNames.length + ' 个站点' : '';
          var siteClass = siteNames.length > 0 ? '' : ' style="color:#c0c4cc"';

          h += '<div class="ssl-cert-row" data-oid="' + c.order_id + '">';
          h += '<div class="ssl-cert-summary">';
          h += '<input type="checkbox" class="ssl-cert-cb" data-oid="' + c.order_id + '" onclick="event.stopPropagation()" style="margin-right:6px;flex-shrink:0" />';
          h += '<span class="ssl-cert-oid">#' + c.order_id + '</span>';
          h += '<span class="ssl-cert-domain">' + P._e(mainDomain) + '</span>';
          h += '<span class="ssl-cert-sites"' + siteClass + '>' + siteText + '</span>';
          h += '<span class="ssl-cert-expire">' + exp + '</span>';
          h += P._statusTag(c);
          h += '</div>';
          h += '<div class="ssl-cert-detail" id="cert-detail-' + c.order_id + '"></div>';
          h += '</div>';
        }
        h += '</div>';
        $('#cert-list').html(h);

        // 绑定点击事件
        $('.ssl-cert-summary').on('click', function () {
          var row = $(this).closest('.ssl-cert-row');
          var oid = row.data('oid');
          if (row.hasClass('expanded')) {
            row.removeClass('expanded');
            return;
          }
          // 关闭其他
          $('.ssl-cert-row.expanded').removeClass('expanded');
          row.addClass('expanded');

          // 有缓存直接用
          if (P._certCache[oid]) {
            P._renderCertDetail(oid, P._certCache[oid]);
            return;
          }
          // 加载详情
          $('#cert-detail-' + oid).html('<div style="text-align:center;padding:20px;color:#c0c4cc;font-size:12px">加载中...</div>');
          P._call('get_cert_detail', { order_id: oid }, function (dr) {
            if (!dr.status) {
              $('#cert-detail-' + oid).html('<div style="padding:10px;color:#f56c6c;font-size:12px">' + P._e(dr.msg) + '</div>');
              return;
            }
            P._certCache[oid] = dr.data;
            P._renderCertDetail(oid, dr.data);
          });
        });
      });
    },

    _renderCertDetail: function (oid, d) {
      var m = d.metadata || {};
      var domains = (d.domains || []).join(', ') || '-';
      var expFull = m.cert_expires_at || '-';
      var daysLeft = '';
      if (m.cert_expires_at) {
        try {
          var expDate = new Date(m.cert_expires_at.replace(' ', 'T').replace(/Z$/, '+00:00'));
          var diff = Math.ceil((expDate.getTime() - new Date().getTime()) / (24 * 60 * 60 * 1000));
          daysLeft = diff >= 0 ? '（剩余 ' + diff + ' 天）' : '（已过期 ' + Math.abs(diff) + ' 天）';
        } catch (e) {}
      }
      var renewMode = d._effective_renew_mode || '';
      var renewLabel = renewMode === 'local' ? '本机提交' : '自动签发';
      var apiObj = d.api || {};
      var apiInfo = apiObj.url ? P._e(apiObj.url) : '未配置';
      if (apiObj.token_masked) apiInfo += ' (' + P._e(apiObj.token_masked) + ')';
      var lastDeploy = m.last_deploy_at || '-';

      var h = '<div class="ssl-detail-grid">';
      h += '<div class="ssl-detail-item"><span class="ssl-detail-label">域名</span><span class="ssl-detail-val">' + P._e(domains) + '</span></div>';
      h += '<div class="ssl-detail-item"><span class="ssl-detail-label">过期时间</span><span class="ssl-detail-val">' + P._fmtTime(expFull) + ' ' + daysLeft + '</span></div>';
      h += '<div class="ssl-detail-item"><span class="ssl-detail-label">续签模式</span><span class="ssl-detail-val">' + renewLabel + '</span></div>';
      if (renewMode === 'local') {
        var vmLabel = d.validation_method === 'file' ? '文件验证' : '委托验证';
        h += '<div class="ssl-detail-item"><span class="ssl-detail-label">验证方式</span><span class="ssl-detail-val">' + vmLabel + '</span></div>';
      }
      h += '<div class="ssl-detail-item"><span class="ssl-detail-label">API 配置</span><span class="ssl-detail-val">' + apiInfo + '</span></div>';
      h += '<div class="ssl-detail-item"><span class="ssl-detail-label">上次部署</span><span class="ssl-detail-val">' + P._fmtTime(lastDeploy) + '</span></div>';
      h += '<div class="ssl-detail-item"><span class="ssl-detail-label">续签状态</span><span class="ssl-detail-val">' + P._renewStateHtml(d) + '</span></div>';
      h += '</div>';

      // 绑定站点（与证书信息同布局）
      var siteDetails = d._site_details || [];
      if (siteDetails.length > 0) {
        var sitesHtml = '';
        for (var i = 0; i < siteDetails.length; i++) {
          var sd = siteDetails[i];
          var matchTag = '';
          if (!sd.found) {
            matchTag = '<span class="ssl-tag ssl-tag-danger">站点不存在</span>';
          } else if (sd.match) {
            if (sd.match.type === 'full') {
              matchTag = '<span class="ssl-tag ssl-tag-success">全部匹配</span>';
            } else {
              matchTag = '<span class="ssl-tag ssl-tag-warning">部分匹配</span>';
            }
          } else {
            matchTag = '<span class="ssl-tag ssl-tag-info">无匹配</span>';
          }
          var deployStatus = m.last_deploy_at ? '<span class="ssl-tag ssl-tag-success">已部署</span>' : '<span class="ssl-tag ssl-tag-info">未部署</span>';
          sitesHtml += '<div class="ssl-site-row"><span>' + P._e(sd.site_name) + '</span><span class="ssl-site-tags">' + matchTag + deployStatus + '</span></div>';
          if (sd.match && sd.match.type === 'partial' && sd.match.unmatched && sd.match.unmatched.length) {
            sitesHtml += '<div class="ssl-unmatched">未覆盖: ' + P._e(sd.match.unmatched.join(', ')) + '</div>';
          }
        }
        h += '<div class="ssl-detail-grid ssl-detail-grid-sites">';
        h += '<div class="ssl-detail-item"><span class="ssl-detail-label">绑定站点</span><span class="ssl-detail-val">' + sitesHtml + '</span></div>';
        h += '</div>';
      }

      // 操作按钮
      h += '<div class="ssl-detail-actions">';
      if (P._haltInfo(d)) {
        h += '<button class="ssl-btn ssl-btn-warning ssl-btn-sm" onclick="sslbt.resetIssueState(' + oid + ')">恢复自动续签</button>';
      }
      h += '<button class="ssl-btn ssl-btn-success ssl-btn-sm" onclick="sslbt.deployCert(' + oid + ')">部署</button>';
      h += '<button class="ssl-btn ssl-btn-sm" onclick="sslbt.checkCert(' + oid + ')">检查</button>';
      h += '<button class="ssl-btn ssl-btn-sm" onclick="sslbt.editCert(' + oid + ')">编辑</button>';
      h += '<button class="ssl-btn ssl-btn-danger ssl-btn-sm" onclick="sslbt.removeCert(' + oid + ')">删除</button>';
      h += '</div>';

      $('#cert-detail-' + oid).html(h);
    },

    // ===== 添加证书（粘贴 URL 模式）=====
    addCert: function () {
      var ipt = 'style="width:100%;padding:8px 10px;border:1px solid #dcdfe6;border-radius:3px;font-size:13px;box-sizing:border-box;font-family:inherit;resize:vertical"';
      layer.open({
        type: 1,
        closeBtn: 2,
        title: '添加证书',
        area: ['560px', '340px'],
        offset: 'auto',
        content:
          '<div id="add-cert-dialog" style="padding:20px 30px">' +
          '<div id="add-step1">' +
          '<p style="margin:0 0 8px;font-size:13px;color:#606266">粘贴部署链接（每行一个）：</p>' +
          '<textarea id="add-urls" rows="6" placeholder="https://your-domain.com/api/deploy?token=xxx&order=123" ' + ipt + '></textarea>' +
          '<p style="margin:8px 0 0;font-size:12px;color:#909399">格式：包含 token 和 order 参数的部署链接</p>' +
          '<div style="margin-top:15px;text-align:right">' +
          '<button class="ssl-btn ssl-btn-primary" onclick="sslbt._parseUrls()">解析</button>' +
          '</div>' +
          '</div>' +
          '<div id="add-step2" style="display:none"></div>' +
          '</div>',
      });
    },

    _parseUrls: function () {
      var text = $('#add-urls').val().trim();
      if (!text) { layer.msg('请输入部署链接', { icon: 2 }); return; }
      var lines = text.split('\n');
      var urls = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line) urls.push(line);
      }
      if (!urls.length) { layer.msg('请输入有效链接', { icon: 2 }); return; }

      $('#add-step1').hide();
      $('#add-step2').html('<div style="text-align:center;padding:30px 0;color:#909399"><i class="layui-layer-loading"></i> 解析中...</div>').show();

      var results = [];
      var done = 0;
      var total = urls.length;

      for (var j = 0; j < urls.length; j++) {
        (function (url) {
          P._call('fetch_deploy_url', { url: url }, function (r) {
            results.push({ url: url, result: r });
            done++;
            if (done === total) {
              P._renderParseResults(results);
            }
          });
        })(urls[j]);
      }
    },

    _renderParseResults: function (results) {
      var allCerts = [];
      var errors = [];
      for (var i = 0; i < results.length; i++) {
        var r = results[i];
        if (!r.result.status) {
          errors.push(P._e(r.url) + ': ' + P._e(r.result.msg));
          continue;
        }
        var data = r.result.data;
        var certs = data.certs || [];
        for (var j = 0; j < certs.length; j++) {
          certs[j]._api_url = (data.api || {}).url || '';
          certs[j]._session_id = data.session_id;
          certs[j]._api_token_masked = (data.api || {}).token_masked || '';
          allCerts.push(certs[j]);
        }
      }

      var h = '';
      if (errors.length) {
        h += '<div style="margin-bottom:12px;padding:8px 10px;background:#fef0f0;border-radius:3px;font-size:12px;color:#f56c6c">';
        for (var e = 0; e < errors.length; e++) h += '<div>' + errors[e] + '</div>';
        h += '</div>';
      }

      if (!allCerts.length) {
        h += '<div style="text-align:center;padding:20px;color:#c0c4cc">未解析到证书</div>';
        h += '<div style="text-align:right;margin-top:10px"><button class="ssl-btn" onclick="$(\'#add-step2\').hide();$(\'#add-step1\').show()">返回</button></div>';
        $('#add-step2').html(h);
        return;
      }

      h += '<div style="margin-bottom:10px;font-size:13px;color:#67c23a;font-weight:600">成功解析 ' + allCerts.length + ' 个证书</div>';

      // 站点去重：同一站点只分配给第一个匹配的证书
      var assignedSites = {};

      for (var c = 0; c < allCerts.length; c++) {
        var cert = allCerts[c];
        var oid = cert.order_id || '-';
        var domains = (cert._domains || []).join(', ') || '-';
        var matches = cert._matches || [];
        // 过滤掉已被前面证书占用的站点
        var availableMatches = [];
        for (var s = 0; s < matches.length; s++) {
          if (!assignedSites[matches[s].site_name]) availableMatches.push(matches[s]);
        }
        // 标记本证书占用的站点
        for (var s = 0; s < availableMatches.length; s++) {
          assignedSites[availableMatches[s].site_name] = true;
        }

        h += '<div style="margin-bottom:12px;padding:10px 12px;background:#fff;border:1px solid #ebeef5;border-radius:4px">';
        h += '<div style="font-size:12px;color:#909399;margin-bottom:6px">';
        h += 'API: ' + P._e(cert._api_url) + ' | Token: ' + P._e(cert._api_token_masked) + ' | 订单: #' + oid;
        h += '</div>';
        h += '<div style="font-size:13px;color:#303133;margin-bottom:8px">' + P._e(domains) + '</div>';

        if (availableMatches.length) {
          h += '<div style="font-size:12px;color:#606266;margin-bottom:4px">匹配站点：</div>';
          for (var s = 0; s < availableMatches.length; s++) {
            var mt = availableMatches[s];
            var isFull = mt.match_type === 'full';
            var tagCls = isFull ? 'ssl-tag-success' : 'ssl-tag-warning';
            var tagTxt = isFull ? '全部匹配' : '部分匹配';
            h += '<label style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;cursor:pointer">';
            // 部分匹配默认不勾选，避免一键部署后未覆盖域名 TLS 失效
            h += '<input type="checkbox"' + (isFull ? ' checked' : '') + ' data-cert-idx="' + c + '" data-site="' + P._e(mt.site_name) + '" class="add-site-cb" />';
            h += P._e(mt.site_name);
            h += ' <span class="ssl-tag ' + tagCls + '">' + tagTxt + '</span>';
            h += '</label>';
            // 部分匹配：列出未被证书覆盖的域名，提示这些域名将失去 TLS 覆盖
            if (!isFull && mt.unmatched && mt.unmatched.length) {
              h += '<div style="margin:0 0 4px 22px;font-size:11px;color:#e6a23c">未覆盖域名: ' + P._e(mt.unmatched.join(', ')) + '</div>';
            }
          }
        } else {
          h += '<div style="font-size:12px;color:#c0c4cc">无匹配站点</div>';
        }
        h += '</div>';
      }

      h += '<div style="text-align:right;margin-top:12px;display:flex;gap:8px;justify-content:flex-end">';
      h += '<button class="ssl-btn" onclick="$(\'#add-step2\').hide();$(\'#add-step1\').show()">返回</button>';
      h += '<button class="ssl-btn ssl-btn-success" onclick="sslbt._doAddCerts()">添加并部署</button>';
      h += '</div>';

      // 存储解析数据
      P._parsedCerts = allCerts;
      $('#add-step2').html(h);

      // 动态调整弹窗高度
      var dialogH = $('#add-cert-dialog').outerHeight() + 80;
      if (dialogH > 500) dialogH = 500;
      var layero = $('#add-cert-dialog').closest('.layui-layer');
      if (layero.length) {
        layero.css('height', dialogH + 'px');
        layero.find('.layui-layer-content').css('height', (dialogH - 42) + 'px');
      }
    },

    _doAddCerts: function () {
      var certs = P._parsedCerts || [];
      if (!certs.length) return;

      // 收集每个证书选中的站点
      var certSites = {};
      $('.add-site-cb:checked').each(function () {
        var idx = $(this).data('cert-idx');
        var site = $(this).data('site');
        if (!certSites[idx]) certSites[idx] = [];
        certSites[idx].push(site);
      });

      // 关闭添加证书弹窗
      var addLayer = $('#add-cert-dialog').closest('.layui-layer').attr('times');
      if (addLayer) layer.close(addLayer);
      var closeLoading = P._loading('正在添加...');

      var total = certs.length;
      var results = [];
      var deployResults = [];

      var finishAll = function () {
        closeLoading();
        var addOk = 0, addFail = [];
        for (var k = 0; k < results.length; k++) {
          if (results[k].status) addOk++;
          else addFail.push('订单 ' + results[k].order_id + ' 添加失败: ' + (results[k].msg || '未知错误'));
        }
        var deployFail = [];
        for (var m = 0; m < deployResults.length; m++) {
          if (!deployResults[m].status) {
            deployFail.push('订单 ' + deployResults[m].order_id + ' 部署失败: ' + (deployResults[m].msg || '未知错误'));
          }
        }
        var msgs = addFail.concat(deployFail);
        if (msgs.length) {
          layer.alert(msgs.join('<br>'), { icon: 2, closeBtn: 2, title: '操作完成（含失败）', offset: 'auto' });
        } else {
          layer.msg('添加并部署成功（' + addOk + ' 个证书）', { icon: 1 });
        }
        P._certCache = {};
        P.loadCerts();
      };
      // 串行处理：部署持有全局互斥锁（与 cron 续签共用），并发发起会互相抢锁失败
      var step = function (idx) {
        if (idx >= total) { finishAll(); return; }
        var c = certs[idx];
        var sites = certSites[idx] || [];
        P._call('add_cert', {
          order_id: c.order_id,
          site_names: sites.join(','),
          renew_mode: '',
          session_id: c._session_id || ''
        }, function (r) {
          results.push({ order_id: c.order_id, status: r.status, msg: r.msg });
          if (!(r.status && sites.length)) { step(idx + 1); return; }
          P._call('deploy_cert', { order_id: c.order_id }, function (dr) {
            deployResults.push({ order_id: c.order_id, status: dr && dr.status, msg: dr && dr.msg });
            step(idx + 1);
          });
        });
      };
      step(0);
    },

    // ===== 证书操作 =====
    deployCert: function (oid, extraParams) {
      var doIt = function () {
        var closeLoading = P._loading('部署中...');
        var params = { order_id: oid };
        if (extraParams) for (var k in extraParams) params[k] = extraParams[k];
        P._call('deploy_cert', params, function (r) {
          closeLoading();
          if (r.need_key) { sslbt._askPrivateKey(oid); return; }
          layer.msg(r.msg, { icon: r.status ? 1 : 2 });
          // 部分站点成功时后端返回 status=false，状态已变化，同样要刷新
          delete P._certCache[oid]; P.loadCerts();
        });
      };
      if (extraParams) { doIt(); return; }
      layer.confirm('确定部署订单 ' + oid + ' 的证书到所有绑定站点？', { offset: 'auto', closeBtn: 2 }, function (idx) {
        layer.close(idx);
        doIt();
      });
    },

    _askPrivateKey: function (oid) {
      var ipt = 'style="width:100%;box-sizing:border-box"';
      layer.open({
        type: 1, closeBtn: 2, title: '请提供私钥', area: ['500px', '340px'], offset: 'auto',
        content: '<div style="padding:20px 30px">' +
          '<p style="margin:0 0 10px;color:#909399;font-size:13px">API 和站点均未找到匹配的私钥，请粘贴 PEM 格式的私钥内容</p>' +
          '<textarea id="deploy-private-key" rows="8" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----" ' + ipt + '></textarea></div>',
        btn: ['部署', '取消'],
        yes: function (idx) {
          var key = $.trim($('#deploy-private-key').val());
          if (!key) { layer.msg('请粘贴私钥内容', { icon: 0 }); return; }
          layer.close(idx);
          sslbt.deployCert(oid, { private_key: key });
        }
      });
    },

    // 终态（CAPPED / EXPIRED / policy 阻断 / 订单异常）后清除本地计数与状态，
    // 让续签引擎下一轮重新接手。签发触顶的证书订单卡在 pending 时，这是唯一出路。
    resetIssueState: function (oid) {
      layer.confirm('确定恢复订单 ' + oid + ' 的自动续签？将清除本地重试计数与停更状态。',
        { offset: 'auto', closeBtn: 2 }, function (idx) {
          layer.close(idx);
          P._call('reset_issue_state', { order_id: oid }, function (r) {
            layer.msg(r.msg, { icon: r.status ? 1 : 2 });
            if (r.status) { delete P._certCache[oid]; P.loadCerts(); }
          });
        });
    },

    _getSelectedOids: function () {
      var oids = [];
      $('.ssl-cert-cb:checked').each(function () { oids.push($(this).data('oid')); });
      return oids;
    },

    deployAll: function () {
      var oids = sslbt._getSelectedOids();
      var msg = oids.length ? '部署选中的 ' + oids.length + ' 个证书？' : '部署所有已启用的证书？';
      layer.confirm(msg, { offset: 'auto', closeBtn: 2 }, function (idx) {
        layer.close(idx);
        var closeLoading = P._loading('批量部署中...');
        var params = oids.length ? { order_ids: oids.join(',') } : null;
        P._call('deploy_all', params, function (r) {
          closeLoading();
          layer.msg(r.msg, { icon: r.status ? 1 : 2 });
          // 部分失败时后端返回 status=false，但已有站点写入成功，仍需刷新列表
          P._certCache = {}; P.loadCerts();
        });
      });
    },

    batchRemove: function () {
      var oids = sslbt._getSelectedOids();
      if (!oids.length) { layer.msg('请先选择证书', { icon: 0 }); return; }
      layer.confirm('确定删除选中的 ' + oids.length + ' 个证书？', { offset: 'auto', closeBtn: 2 }, function (idx) {
        layer.close(idx);
        var done = 0, fail = 0, total = oids.length;
        var closeLoading = P._loading('批量删除中...');
        for (var i = 0; i < oids.length; i++) {
          (function (oid) {
            P._call('remove_cert', { order_id: oid }, function (r) {
              if (!r.status) fail++;
              done++;
              if (done === total) {
                closeLoading();
                var msg = fail ? '删除完成: ' + (total - fail) + ' 成功 / ' + fail + ' 失败' : '删除完成';
                layer.msg(msg, { icon: fail ? 2 : 1 });
                P._certCache = {}; P.loadCerts();
              }
            });
          })(oids[i]);
        }
      });
    },

    checkCert: function (oid) {
      P._call('check_cert', { order_id: oid }, function (r) {
        if (!r.status) { layer.msg(r.msg, { icon: 2 }); return; }
        var d = r.data;
        var statusMap = { active: '正常', pending: '待签发', expired: '已过期', revoked: '已吊销', processing: '处理中' };
        var statusText = statusMap[d.status] || d.status || '-';
        var domains = d.domains || d.common_name || d.domain || '-';
        var updated = d._order_updated;
        var h = '<div style="padding:20px 30px;font-size:13px;line-height:2">';
        if (updated) {
          h += '<p style="color:#e6a23c;font-weight:bold">订单已续费，ID 已自动更新</p>';
        }
        h += '<p><b>订单 ID：</b>' + P._e(String(d.order_id || oid)) + '</p>';
        h += '<p><b>状态：</b>' + P._e(statusText) + '</p>';
        h += '<p><b>域名：</b>' + P._e(domains) + '</p>';
        h += '<p><b>过期时间：</b>' + P._e(d.expires_at || '-') + '</p>';
        h += '</div>';
        layer.open({
          type: 1,
          closeBtn: 2,
          title: '证书状态',
          area: ['420px', updated ? '290px' : '270px'],
          offset: 'auto',
          content: h,
          end: function () { if (updated) { P._certCache = {}; P.loadCerts(); } },
        });
      });
    },

    editCert: function (oid) {
      // 从缓存或列表获取数据
      var cert = P._certCache[oid];
      if (!cert) {
        var certs = P._certList || [];
        for (var i = 0; i < certs.length; i++) {
          if (certs[i].order_id === oid) { cert = certs[i]; break; }
        }
      }
      if (!cert) { layer.msg('证书数据未加载', { icon: 2 }); return; }

      var renewMode = cert.renew_mode || '';
      var effectiveMode = cert._effective_renew_mode || renewMode || 'pull';
      var validationMethod = cert.validation_method || 'delegation';
      var certApi = cert.api || {};
      var apiUrl = certApi.url || '';
      var apiTokenMasked = certApi.token_masked || '';

      // 检测域名类型限制
      var domains = cert.domains || [];
      var hasIP = false, hasWildcard = false;
      for (var di = 0; di < domains.length; di++) {
        var dd = domains[di];
        if (/^\d{1,3}(\.\d{1,3}){3}$/.test(dd) || dd.indexOf(':') !== -1) hasIP = true;
        if (dd.indexOf('*.') === 0) hasWildcard = true;
      }

      P._call('get_site_matches', { order_id: oid }, function (r) {
        var allSites = (r.status && r.data) ? r.data : [];

        var ipt = 'style="width:100%;padding:7px 10px;border:1px solid #dcdfe6;border-radius:3px;font-size:13px;box-sizing:border-box"';
        var lbl = 'style="display:block;margin-bottom:4px;font-size:13px;color:#606266"';
        var row = 'style="margin-bottom:14px"';

        // 站点多选列表
        var sitesHtml = '<div id="edit-sites-list" style="max-height:150px;overflow-y:auto;border:1px solid #dcdfe6;border-radius:3px;padding:6px 10px">';
        if (!allSites.length) {
          sitesHtml += '<span style="color:#c0c4cc;font-size:12px">暂无站点</span>';
        }
        for (var i = 0; i < allSites.length; i++) {
          var s = allSites[i];
          var tag = '';
          if (s.match_type === 'full') {
            tag = '<span class="ssl-tag ssl-tag-success" style="margin-left:6px">全部匹配</span>';
          } else if (s.match_type === 'partial') {
            tag = '<span class="ssl-tag ssl-tag-warning" style="margin-left:6px">部分匹配</span>';
          } else {
            tag = '<span class="ssl-tag ssl-tag-info" style="margin-left:6px">无匹配</span>';
          }
          sitesHtml += '<label style="display:flex;align-items:center;padding:3px 0;font-size:12px;cursor:pointer;gap:6px">';
          sitesHtml += '<input type="checkbox" class="edit-site-cb" value="' + P._e(s.site_name) + '"' + (s.bound ? ' checked' : '') + ' />';
          sitesHtml += '<span>' + P._e(s.site_name) + '</span>' + tag;
          sitesHtml += '</label>';
          // 部分匹配：提示该站点未被证书覆盖的域名
          if (s.match_type === 'partial' && s.unmatched && s.unmatched.length) {
            sitesHtml += '<div style="margin:0 0 4px 22px;font-size:11px;color:#e6a23c">未覆盖域名: ' + P._e(s.unmatched.join(', ')) + '</div>';
          }
        }
        sitesHtml += '</div>';

        layer.open({
          type: 1,
          closeBtn: 2,
          title: '编辑证书 #' + oid,
          area: ['480px', '460px'],
          offset: 'auto',
          content:
            '<div style="padding:20px 30px">' +
            '<div ' + row + '><label ' + lbl + '>绑定站点</label>' + sitesHtml + '</div>' +
            '<div ' + row + '><label ' + lbl + '>续签模式</label><select id="edit-renew-mode" ' + ipt + ' onchange="sslbt._toggleVmRow()">' +
            // SAN 含 IP 的证书强制 local/file（禁用 pull/delegation，安全约束仍在后端派生）
            '<option value="pull"' + (hasIP ? ' disabled' : '') + (effectiveMode !== 'local' && !hasIP ? ' selected' : '') + '>自动签发</option>' +
            '<option value="local"' + (effectiveMode === 'local' || hasIP ? ' selected' : '') + '>本机提交</option></select></div>' +
            '<div id="edit-vm-row" style="margin-bottom:14px;display:' + ((effectiveMode === 'local' || hasIP) ? 'block' : 'none') + '"><label ' + lbl + '>验证方式</label><select id="edit-validation-method" ' + ipt + '>' +
            '<option value="delegation"' + (hasIP ? ' disabled' : '') + (validationMethod !== 'file' && !hasIP ? ' selected' : '') + '>委托验证</option>' +
            '<option value="file"' + (hasWildcard ? ' disabled' : '') + ((validationMethod === 'file' || hasIP) && !hasWildcard ? ' selected' : '') + '>文件验证</option>' +
            '</select></div>' +
            '<div ' + row + '><label ' + lbl + '>API URL</label><input id="edit-api-url" value="' + P._e(apiUrl) + '" placeholder="https://..." ' + ipt + ' /></div>' +
            '<div ' + row + '><label ' + lbl + '>API Token' + (apiTokenMasked ? ' <span style="color:#c0c4cc;font-weight:400">当前: ' + P._e(apiTokenMasked) + '</span>' : '') + '</label><input id="edit-api-token" value="" placeholder="留空则不修改" ' + ipt + ' /></div>' +
            '</div>',
          btn: ['保存', '取消'],
          yes: function (idx) {
            var newSites = [];
            $('.edit-site-cb:checked').each(function () { newSites.push($(this).val()); });
            var newMode = $('#edit-renew-mode').val();
            var newApiUrl = $('#edit-api-url').val().trim();
            var newApiToken = $('#edit-api-token').val().trim();
            layer.close(idx);
            var closeLoading = P._loading('保存中...');
            var params = {
              order_id: oid,
              site_names: newSites.join(','),
              renew_mode: newMode
            };
            if (newMode === 'local') params.validation_method = $('#edit-validation-method').val();
            if (newApiUrl) params.api_url = newApiUrl;
            if (newApiToken) params.api_token = newApiToken;
            P._call('update_cert_config', params, function (r) {
              closeLoading();
              layer.msg(r.status ? '保存成功' : r.msg, { icon: r.status ? 1 : 2 });
              if (r.status) { delete P._certCache[oid]; P.loadCerts(); }
            });
          },
        });
      });
    },

    _toggleVmRow: function () {
      var show = $('#edit-renew-mode').val() === 'local';
      $('#edit-vm-row').toggle(show);
    },

    removeCert: function (oid) {
      layer.confirm('确定删除订单 ' + oid + '？（不会影响已部署的证书）', { offset: 'auto', closeBtn: 2 }, function (idx) {
        layer.close(idx);
        P._call('remove_cert', { order_id: oid }, function (r) {
          layer.msg(r.msg, { icon: r.status ? 1 : 2 });
          if (r.status) { delete P._certCache[oid]; P.loadCerts(); }
        });
      });
    },

    runRenew: function () {
      var closeLoading = P._loading('续签检查中...');
      P._call('run_renew', null, function (r) {
        closeLoading();
        if (!r.status) { layer.msg(r.msg, { icon: 2 }); return; }
        var rs = r.data || [];
        if (!rs.length) { layer.msg('无需续签的证书', { icon: 1 }); return; }
        var h = '<div style="padding:15px 20px"><table class="ssl-table"><thead><tr><th>订单</th><th>状态</th><th>信息</th></tr></thead><tbody>';
        // message 可能含 nginx 配置诊断等任意文本，必须转义
        for (var i = 0; i < rs.length; i++)
          h += '<tr><td>' + P._e(rs[i].order_id) + '</td><td>' + P._e(rs[i].status)
            + '</td><td>' + P._e(rs[i].message) + '</td></tr>';
        h += '</tbody></table></div>';
        layer.open({ type: 1, closeBtn: 2, title: '续签结果', area: ['560px', '400px'], offset: 'auto', content: h });
        P._certCache = {};
        P.loadCerts();
      });
    },

    // ===== 设置 =====
    loadSettings: function () {
      if (!P._settingsRendered) {
        P._renderSettings();
      }
      // 状态按进入设置页刷新，只更新文字，不重建 DOM，也不轮询。
      sslbt._loadCronStatus();
      sslbt._loadRenewStatus();
      if (P._settingsLoaded || P._settingsLoading) return;
      P._settingsLoading = true;
      P._call('get_config', null, function (r) {
        P._settingsLoading = false;
        if (!r.status) {
          $('#update-result').html('<span style="color:#f56c6c">加载设置失败: ' + P._e(r.msg) + '</span>');
          return;
        }
        var c = r.data;
        $('#update-channel').val(c.upgrade_channel || 'main').prop('disabled', false);
        $('#plugin-version').text(c.plugin_version || '0.0.0');
        $('#update-result').empty();
        P._settingsLoaded = true;
      });
    },

    _renderSettings: function () {
      var h = '';

      // Section 1: 计划任务
      h += '<div class="ssl-settings-section"><table>';
      h += '<tr><td>计划任务</td><td>';
      h += '<button class="ssl-btn ssl-btn-sm" onclick="sslbt.setupCron()">设置计划任务</button> ';
      h += '<button class="ssl-btn ssl-btn-sm" onclick="sslbt.removeCron()">删除计划任务</button>';
      h += ' <span id="cron-status" style="color:#909399;font-size:12px;margin-left:8px"></span>';
      h += '</td></tr>';
      h += '<tr><td>最近续签</td><td><span id="renew-status" style="color:#909399;font-size:12px">加载中...</span></td></tr>';
      h += '</table></div>';

      // Section 3: 批量操作
      h += '<div class="ssl-settings-section"><table>';
      h += '<tr><td>续签模式</td><td>';
      h += '<select id="batch-renew-mode" style="width:94px" onchange="sslbt._toggleBatchVm()">';
      h += '<option value="pull">自动签发</option><option value="local">本机提交</option></select> ';
      h += '<span id="batch-vm-wrap" style="display:none">';
      h += '<select id="batch-validation-method" style="width:94px"><option value="delegation">委托验证</option><option value="file">文件验证</option></select> ';
      h += '</span>';
      h += '<button class="ssl-btn ssl-btn-sm" onclick="sslbt.batchSetRenewMode()">应用到全部证书</button>';
      h += '</td></tr>';
      h += '</table></div>';

      // Section 4: 插件升级
      h += '<div class="ssl-settings-section"><table>';
      h += '<tr><td>插件更新</td><td>';
      h += '<select id="update-channel" style="width:94px" onchange="sslbt.saveUpdateChannel()" disabled>';
      h += '<option value="main">稳定版</option><option value="dev">测试版</option></select> ';
      h += '<button class="ssl-btn ssl-btn-sm" onclick="sslbt.checkUpdate()">检查更新</button>';
      h += ' <span style="color:#909399;font-size:12px;margin-left:8px">当前: <span id="plugin-version">加载中...</span></span>';
      h += '<span id="update-result" style="margin-left:10px"></span>';
      h += '</td></tr>';
      h += '</table></div>';

      $('#settings-form').html(h);
      P._settingsRendered = true;
    },

    _loadCronStatus: function () {
      P._call('get_cron_status', null, function (r) {
        if (!r.status || !r.data) return;
        var d = r.data;
        var el = document.getElementById('cron-status');
        if (!el) return;
        el.textContent = d.exists ? '当前: ' + d.cycle : '未设置';
      });
    },

    _loadRenewStatus: function () {
      P._call('get_renew_status', null, function (r) {
        var el = document.getElementById('renew-status');
        if (!el) return;
        if (!r.status || !r.data) { el.textContent = '暂无续签记录'; return; }
        var d = r.data;
        var t = (d.last_run || '').replace('T', ' ').replace('Z', ' UTC');
        el.textContent = t + '：共 ' + (d.total || 0) + '，成功 ' + (d.success || 0) +
          '，等待 ' + (d.pending || 0) + '，失败 ' + (d.failure || 0);
      });
    },

    setupCron: function () {
      P._call('setup_cron', {}, function (r) {
        layer.msg(r.msg, { icon: r.status ? 1 : 2 });
        if (r.status) sslbt._loadCronStatus();
      });
    },

    removeCron: function () {
      layer.confirm('确定删除计划任务？', { offset: 'auto', closeBtn: 2 }, function (idx) {
        layer.close(idx);
        P._call('remove_cron', null, function (r) {
          layer.msg(r.msg, { icon: r.status ? 1 : 2 });
          if (r.status) sslbt._loadCronStatus();
        });
      });
    },

    _toggleBatchVm: function () {
      var show = $('#batch-renew-mode').val() === 'local';
      $('#batch-vm-wrap').toggle(show);
    },

    batchSetRenewMode: function () {
      var mode = $('#batch-renew-mode').val();
      var label = mode === 'local' ? '本机提交' : '自动签发';
      var confirmMsg = '确定将所有证书的续签策略设为「' + label + '」？';
      if (mode === 'local') {
        var vmLabel = $('#batch-validation-method').val() === 'file' ? '文件验证' : '委托验证';
        confirmMsg += '\n验证方式：' + vmLabel + '（含 IP 的证书强制文件验证，不兼容的证书将跳过）';
      }
      layer.confirm(confirmMsg, { offset: 'auto', closeBtn: 2 }, function (idx) {
        layer.close(idx);
        // 一次原子后端操作，逐证书派生（含 IP 的证书强制 local/file）
        var params = { renew_mode: mode };
        if (mode === 'local') params.validation_method = $('#batch-validation-method').val();
        P._call('batch_set_renew_policy', params, function (r) {
          layer.msg(r.msg, { icon: r.status ? 1 : 2 });
          if (r.status) { P._certCache = {}; P.loadCerts(); }
        });
      });
    },

    saveUpdateChannel: function () {
      P._call('save_config', { upgrade_channel: $('#update-channel').val() }, function (r) {
        if (r.status) layer.msg('已切换', { icon: 1 });
      });
    },

    _ui: null,
    _promptReleaseUrl: function () {
      layer.open({
        type: 1,
        closeBtn: 2,
        title: '设置升级服务器',
        area: ['400px', '200px'],
        offset: 'auto',
        content:
          '<div style="padding:20px 30px">' +
          '<p style="font-size:13px;color:#606266;margin-bottom:12px">升级服务器不可用，请输入新的域名：</p>' +
          '<input id="new-release-host" placeholder="例如 release.cnssl.com" style="width:100%;padding:8px 10px;border:1px solid #dcdfe6;border-radius:3px;font-size:13px;box-sizing:border-box" />' +
          '</div>',
        btn: ['保存', '取消'],
        yes: function (idx) {
          var host = ($('#new-release-host').val() || '').trim();
          if (!host) { layer.msg('请输入域名', { icon: 2 }); return; }
          var url = 'https://' + host.replace(/^https?:\/\//, '').replace(/\/+$/, '') + '/sslbt';
          P._call('save_config', { release_url: url }, function (r) {
            layer.close(idx);
            if (r.status) {
              layer.msg('已更新，请重新检查更新', { icon: 1 });
              document.getElementById('update-result').innerHTML = '';
            } else {
              layer.msg(r.msg, { icon: 2 });
            }
          });
        },
      });
    },

    checkUpdate: function () {
      var sp = document.getElementById('update-result');
      sp.innerHTML = '<span style="color:#e6a23c">检查中...</span>';
      P._call('check_update', {}, function (r) {
        if (r.status && r.data) {
          var d = r.data;
          if (d.has_update) {
            sp.innerHTML = '<span style="color:#67c23a">发现新版本: <b>' + P._e(d.latest_version) + '</b></span>' +
              ' <button class="ssl-btn ssl-btn-success ssl-btn-sm" onclick="sslbt.doUpdate()">立即更新</button>';
            P._ui = d;
          } else if (d.error) {
            sp.innerHTML = '<span style="color:#f56c6c">' + P._e(d.error) + '</span>' +
              ' <button class="ssl-btn ssl-btn-sm" onclick="sslbt._promptReleaseUrl()">设置</button>';
          } else {
            sp.innerHTML = '<span style="color:#909399">当前已是最新版本</span>';
          }
        } else {
          sp.innerHTML = '<span style="color:#f56c6c">' + P._e(r.msg || '检查失败') + '</span>' +
            ' <button class="ssl-btn ssl-btn-sm" onclick="sslbt._promptReleaseUrl()">设置升级地址</button>';
        }
      });
    },

    doUpdate: function () {
      if (!P._ui || !confirm('确定要更新到 ' + P._ui.latest_version + ' 吗？')) return;
      var sp = document.getElementById('update-result');
      sp.innerHTML = '<span style="color:#e6a23c">更新中，请勿关闭页面...</span>';
      P._call('do_update', {
        version: P._ui.latest_version,
        checksum: P._ui.checksum || ''
      }, function (r) {
        if (r.status) {
          P._rememberPostUpdate(P._ui.latest_version);
          sp.innerHTML = '<span style="color:#67c23a">更新成功！</span>';
          layer.alert('插件更新成功。刷新页面即可加载新版本；若刷新后仍有异常，请重启宝塔面板。', {
            closeBtn: 2,
            title: '更新完成',
            icon: 1,
            offset: 'auto',
            btn: ['刷新页面'],
            yes: function () { (window.top || window).location.reload(); }
          });
        } else {
          sp.innerHTML = '<span style="color:#f56c6c">更新失败: ' + P._e(r.msg || '未知错误') + '</span>' +
            ' <button class="ssl-btn ssl-btn-sm" onclick="sslbt._promptReleaseUrl()">更换升级地址</button>';
        }
      });
    },

    // ===== 日志 =====
    loadLogs: function () {
      P._call('get_logs', { date: $('#log-date').val() || null }, function (r) {
        if (!r.status) { $('#log-content').text(r.msg); return; }
        $('#log-content').text(r.data.content || '暂无日志');
        var sel = $('#log-date'), cur = sel.val(), dates = r.data.dates || [];
        sel.empty();
        if (!dates.length) sel.append('<option value="">今天</option>');
        for (var i = 0; i < dates.length; i++)
          sel.append('<option value="' + dates[i] + '">' + dates[i] + '</option>');
        if (cur) sel.val(cur);
      });
    },

    clearLogs: function () {
      layer.confirm('确定清除所有日志？', { offset: 'auto', closeBtn: 2 }, function (idx) {
        layer.close(idx);
        P._call('clear_logs', null, function (r) {
          layer.msg(r.msg, { icon: r.status ? 1 : 2 });
          if (r.status) P.loadLogs();
        });
      });
    },
  };

  window.sslbt = P;
  P.init();
})();
</script>
