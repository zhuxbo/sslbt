name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: make test

  openssl-102-compat:
    runs-on: ubuntu-latest
    env:
      OPENSSL_102_VERSION: 1.0.2k
      OPENSSL_102_SHA256: 6b3977c61f2aedf0f96367dcfb5c6e578cf37e7b8d913b4ecb6643c3cb88d8c0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: pip install pytest
      - name: Build OpenSSL 1.0.2k
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openssl-$OPENSSL_102_VERSION.tar.gz"
          source_dir="$RUNNER_TEMP/openssl-$OPENSSL_102_VERSION"
          install_dir="$RUNNER_TEMP/openssl-$OPENSSL_102_VERSION-install"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/openssl/openssl/releases/download/OpenSSL_1_0_2k/openssl-$OPENSSL_102_VERSION.tar.gz"
          echo "$OPENSSL_102_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$source_dir"
          ./config no-shared --prefix="$install_dir"
          make -j2
          make install_sw
          echo "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Test OpenSSL 1.0.2 compatibility
        run: |
          test "$(openssl version | awk '{print $2}')" = "$OPENSSL_102_VERSION"
          python -m pytest \
            tests/test_cert_utils.py::TestSanParsing::test_parse_cert_info_with_runtime_openssl \
            -v -W error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: make lint

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make check-agent-config
      - run: bash build/release.sh --dry-run 0.0.0-ci.${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    needs: [test, openssl-102-compat, lint, governance]
    steps:
      - uses: actions/checkout@v5
      - run: make build VERSION=0.0.0-ci.${{ github.sha }}
